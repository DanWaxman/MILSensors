[project]
name = "milsensors"
version = "0.1.0"
authors = [
  {name = "Daniel Waxman", email = "daniel.waxman@stonybrook.edu"},
  {name = "Fernando Llorente", email = "fllorente@bnl.gov"},
]
description = "A Python toolkit for selecting optimal sensor networks in spatiotemporal settings by minimizing information loss from emulators."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax==0.4.6",
    "jaxlib==0.4.6",
    "numpy<2",
    "osmnx>=2.0.6",
    "scipy==1.11.3",
    "uncertainty-toolbox>=0.1.1",
]
license = "MIT"


[tool.setuptools.packages.find]
include = ["milsensors*"] 
exclude = ["tests*", "docs*", "data*", "experiments*"]
